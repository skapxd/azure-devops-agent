name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # El CLI se anuncia como multiplataforma: los perfiles de shell donde
        # busca el token y las rutas de git difieren por sistema, así que se
        # comprueba en los tres en vez de fiarlo a que "debería funcionar".
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Las pruebas no necesitan token ni red: los repositorios de git se crean
      # al vuelo y las respuestas de la API se simulan sustituyendo fetch.
      - run: pnpm run check

      - name: Auditoría de dependencias
        run: pnpm audit --audit-level moderate
